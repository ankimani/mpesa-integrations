spring.application.name=mpesa-integration

spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.servlet.context-path=/

management.endpoints.web.exposure.include=health,info

mpesa.daraja.base-url=${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
mpesa.daraja.consumer-key=${MPESA_CONSUMER_KEY:}
mpesa.daraja.consumer-secret=${MPESA_CONSUMER_SECRET:}
mpesa.daraja.short-code=${MPESA_SHORT_CODE:}
mpesa.daraja.passkey=${MPESA_PASSKEY:}

mpesa.daraja.stk-callback-url=${MPESA_STK_CALLBACK_URL:}
mpesa.daraja.callback-secret-token=${MPESA_CALLBACK_SECRET_TOKEN:}
mpesa.daraja.connect-timeout-ms=5000
mpesa.daraja.read-timeout-ms=30000
mpesa.daraja.transaction-type=CustomerPayBillOnline
mpesa.daraja.max-attempts=${MPESA_MAX_ATTEMPTS:1}
mpesa.daraja.retry-delay-ms=${MPESA_RETRY_DELAY_MS:0}

logging.level.com.mpesa.integration=INFO
logging.level.org.springframework.web.client=INFO
